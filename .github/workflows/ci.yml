name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Every job opts into the permissions it needs; the default is read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: sqlite
            test_db: sqlite
            dsn: ""
          - db: postgres
            test_db: postgres
            dsn: postgres://sharedcal:sharedcal@localhost:5432/sharedcal?sslmode=disable
          - db: mysql
            test_db: mysql
            dsn: root:sharedcal@tcp(localhost:3306)/sharedcal
          - db: mariadb
            test_db: mysql
            dsn: root:sharedcal@tcp(localhost:3306)/sharedcal
    services:
      # An empty image name skips the service, so each matrix entry starts
      # only the database it tests.
      postgres:
        image: ${{ matrix.db == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: sharedcal
          POSTGRES_USER: sharedcal
          POSTGRES_PASSWORD: sharedcal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sharedcal -d sharedcal"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: ${{ (matrix.db == 'mysql' && 'mysql:8.4') || (matrix.db == 'mariadb' && 'mariadb:10.11') || '' }}
        env:
          MYSQL_ROOT_PASSWORD: sharedcal
          MYSQL_DATABASE: sharedcal
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psharedcal"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SHAREDCAL_TEST_DB: ${{ matrix.test_db }}
      SHAREDCAL_TEST_DSN: ${{ matrix.dsn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Web placeholder
        # web/embed.go embeds web/dist; Go-only jobs don't need the real app.
        run: |
          mkdir -p web/dist
          [ -f web/dist/index.html ] || echo '<!doctype html><title>SharedCal</title>' > web/dist/index.html
      - name: go vet
        if: matrix.db == 'sqlite'
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v /node_modules/)
          mapfile -t pkgs <<< "$pkgs"
          go vet "${pkgs[@]}"
      - name: go test (race)
        if: matrix.db == 'sqlite'
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v /node_modules/)
          mapfile -t pkgs <<< "$pkgs"
          go test -race -count=1 "${pkgs[@]}"
      - name: go test
        if: matrix.db != 'sqlite'
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v /node_modules/)
          mapfile -t pkgs <<< "$pkgs"
          go test -count=1 "${pkgs[@]}"

  go-lint:
    name: Go lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Web placeholder
        # web/embed.go embeds web/dist; Go-only jobs don't need the real app.
        run: |
          mkdir -p web/dist
          [ -f web/dist/index.html ] || echo '<!doctype html><title>SharedCal</title>' > web/dist/index.html
      - name: gofmt
        run: |
          mapfile -t files < <(git ls-files '*.go')
          unformatted=$(gofmt -l "${files[@]}")
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }
      - name: staticcheck
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v /node_modules/)
          mapfile -t pkgs <<< "$pkgs"
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 "${pkgs[@]}"
      - name: govulncheck
        run: |
          set -o pipefail
          pkgs=$(go list ./... | grep -v /node_modules/)
          mapfile -t pkgs <<< "$pkgs"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 "${pkgs[@]}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (includes theme contrast check)
        run: npm test
      - run: npm run build
      - name: Bundle size budget
        run: npm run check:size

  pre-commit:
    name: Pre-commit hooks and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Web dependencies
        # The prettier, eslint and tsc hooks run from web/node_modules.
        working-directory: web
        run: npm ci
      - name: Web placeholder
        # web/embed.go embeds web/dist; go vet and staticcheck need the file.
        run: |
          mkdir -p web/dist
          [ -f web/dist/index.html ] || echo '<!doctype html><title>SharedCal</title>' > web/dist/index.html
      - name: gitleaks (full history)
        # The gitleaks hook only scans staged changes, so it finds nothing
        # under --all-files; scan every commit here instead.
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        env:
          SKIP: gitleaks
        run: |
          python -m pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure --color=always

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        # playwright.config starts `go run ./cmd/mockoidc` and
        # `go run ./cmd/sharedcal serve` itself.
        working-directory: web
        run: npm run test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  image:
    name: Container image
    needs: [go, go-lint, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR (tags only)
      id-token: write # keyless cosign signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # No QEMU needed: builder stages run natively and cross-compile; the
      # runtime stage has no RUN steps.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on tags)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Release-only: SBOM, signature, attestations ----------------------
      - name: Generate SBOM (syft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign image and attach SBOM (cosign, keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
      - name: Build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
