# Minimal SharedCal deployment: SQLite and attachments in ./data.
# Put OIDC_CLIENT_ID / OIDC_CLIENT_SECRET in a .env file next to this one.
# ./data must be writable by uid 65532:  mkdir -p data && sudo chown 65532:65532 data
services:
  sharedcal:
    image: ghcr.io/felixtrav/sharedcal:1
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./data:/data"]
    environment:
      APP_URL: https://cal.example.com
      OIDC_ISSUER: https://id.example.com
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_ADMIN_GROUPS: calendar-admins
      OIDC_WRITER_GROUPS: calendar-writers
