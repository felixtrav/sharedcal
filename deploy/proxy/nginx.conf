# nginx in front of SharedCal (include inside the http {} block).
# Set TRUSTED_PROXIES on SharedCal to nginx's address so the X-Forwarded-*
# headers below are trusted.

upstream sharedcal {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cal.example.com;

    ssl_certificate     /etc/letsencrypt/live/cal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Uploads: at least ATTACHMENT_MAX_SIZE (25 MB) plus multipart overhead.
    client_max_body_size 30m;
    # Stream uploads to the app instead of spooling them to disk first.
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # Live updates (Server-Sent Events): never buffer, never cache, keep the
    # connection open. This is the one setting that matters; without it
    # changes arrive in bursts or not at all.
    location = /api/stream {
        proxy_pass http://sharedcal;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location / {
        proxy_pass http://sharedcal;
        proxy_read_timeout 60s;
    }
}
